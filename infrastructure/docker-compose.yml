services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bayenat
      POSTGRES_USER: bayenat
      POSTGRES_PASSWORD: bayenat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - bayenat_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    working_dir: /app
    command: python -m app.workers.worker
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - bayenat_storage:/app/storage
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  bayenat_storage:
